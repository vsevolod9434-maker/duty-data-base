name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SUPABASE_URL: https://xtvrvocckogqvwcgetrz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_viYzc4U7oueN_e2LTqcBKw_vPUz-Ja6
      NEXT_PUBLIC_ACCESS_ADMIN_FUNCTION_URL: https://xtvrvocckogqvwcgetrz.supabase.co/functions/v1/access-admin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Prisma schema
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npx prisma validate

      - name: Test
        run: npm test

      - name: Build static site
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
