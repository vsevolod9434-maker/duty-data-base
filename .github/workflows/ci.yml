name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-prisma-overrides-lock:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/prisma-transitive-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/prisma-transitive-audit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm install --package-lock-only

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Refresh lockfile for Prisma dependency overrides"
          git push origin HEAD:fix/prisma-transitive-audit

  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SUPABASE_URL: https://xtvrvocckogqvwcgetrz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_viYzc4U7oueN_e2LTqcBKw_vPUz-Ja6
      NEXT_PUBLIC_ACCESS_ADMIN_FUNCTION_URL: https://xtvrvocckogqvwcgetrz.supabase.co/functions/v1/access-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Test and typecheck
        run: npm test

      - name: Build static site
        run: npm run build:pages
