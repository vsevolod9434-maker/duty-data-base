name: Duty database maintenance 2026-10-01

on:
  push:
    branches: ["main"]
    paths:
      - "ops/run-duty-maintenance-2026-10-01"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duty-database-maintenance
  cancel-in-progress: false

jobs:
  purge-and-harden:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Purge duty profiles and harden access
        run: node scripts/maintenance-2026-10-01.mjs
